# Claude Code Damage Control - Security Patterns
# Adapted from disler/claude-code-damage-control
# Three-tier protection: zeroAccess > readOnly > noDelete

# =============================================================================
# DANGEROUS BASH COMMANDS - Block or Ask
# =============================================================================
bashPatterns:
  # --- FILE DESTRUCTION ---
  # NOTE: rm -rf targeting build caches (.next, node_modules, dist, target, build,
  # __pycache__, .turbo, .parcel-cache, .cache, .tsbuildinfo) is ALLOWED via the
  # safe-target allowlist in damage-control.sh, which short-circuits before this
  # pattern — EXCEPT when the target IS or CONTAINS a final installable
  # (*.app/*.ipa/*.apk/*.aab) or the kept-artifacts home: the final-artifact guard
  # (build-artifact-preservation, 1.28.0) runs first and asks/blocks regardless of
  # the enclosing dir name. See docs/operations/build-cleanup-preserve-installables.md.
  - pattern: "rm\\s+(-[^\\s]*)?-[rf]"
    description: "rm with recursive or force flags (except build caches)"
    action: block

  - pattern: "rmdir\\s+--ignore-fail-on-non-empty"
    description: "rmdir ignoring non-empty"
    action: block

  # --- PERMISSIONS ---
  - pattern: "chmod\\s+777"
    description: "chmod 777 (world-writable)"
    action: block

  - pattern: "chown\\s+(-R|--recursive)\\s+root"
    description: "recursive chown to root"
    action: block

  # --- GIT DESTRUCTIVE ---
  - pattern: "git\\s+reset\\s+--hard"
    description: "git reset --hard (loses uncommitted changes)"
    action: block

  - pattern: "git\\s+clean\\s+-[fd]"
    description: "git clean (removes untracked files)"
    action: block

  - pattern: "git\\s+push.*--force([^-]|$)"
    description: "git push --force (use --force-with-lease instead)"
    action: block

  - pattern: "git\\s+push.*\\s-f([^o]|$)"
    description: "git push -f (use --force-with-lease instead)"
    action: block

  - pattern: "git\\s+checkout\\s+\\.\\s*$"
    description: "git checkout . (discards all uncommitted changes)"
    action: block

  - pattern: "git\\s+restore\\s+\\.\\s*$"
    description: "git restore . (discards all uncommitted changes)"
    action: block

  - pattern: "git\\s+stash\\s+clear"
    description: "git stash clear (loses all stashes)"
    action: block

  # --- GIT RISKY (ASK) ---
  - pattern: "git\\s+branch\\s+-[dD]"
    description: "delete git branch"
    action: ask

  - pattern: "git\\s+stash\\s+drop"
    description: "drop a git stash"
    action: ask

  - pattern: "git\\s+push.*origin\\s+(main|master)\\b"
    description: "push directly to main/master branch"
    action: ask

  # --- CLOUD INFRASTRUCTURE ---
  - pattern: "aws\\s+ec2\\s+terminate-instances"
    description: "AWS EC2 terminate"
    action: block

  - pattern: "aws\\s+rds\\s+delete-db"
    description: "AWS RDS delete"
    action: block

  - pattern: "aws\\s+s3\\s+rb.*--force"
    description: "AWS S3 bucket force delete"
    action: block

  - pattern: "gcloud.*delete"
    description: "GCP delete operation"
    action: ask

  - pattern: "az\\s+.*\\s+delete"
    description: "Azure delete operation"
    action: ask

  # --- INFRASTRUCTURE AS CODE ---
  - pattern: "terraform\\s+destroy"
    description: "terraform destroy"
    action: block

  - pattern: "pulumi\\s+destroy"
    description: "pulumi destroy"
    action: block

  # --- KUBERNETES ---
  - pattern: "kubectl\\s+delete\\s+namespace"
    description: "kubectl delete namespace"
    action: block

  - pattern: "kubectl\\s+delete.*--all"
    description: "kubectl delete all resources"
    action: block

  # --- DOCKER ---
  - pattern: "docker\\s+system\\s+prune\\s+-a"
    description: "docker system prune all"
    action: ask

  - pattern: "docker\\s+rm\\s+-f.*\\$\\(docker\\s+ps"
    description: "docker remove all containers"
    action: block

  # --- DATABASES ---
  - pattern: "DROP\\s+DATABASE"
    description: "DROP DATABASE"
    action: block
    caseSensitive: false

  - pattern: "DROP\\s+TABLE"
    description: "DROP TABLE"
    action: ask
    caseSensitive: false

  - pattern: "TRUNCATE\\s+TABLE"
    description: "TRUNCATE TABLE"
    action: ask
    caseSensitive: false

  - pattern: "DELETE\\s+FROM\\s+\\w+\\s*;?$"
    description: "DELETE without WHERE clause"
    action: block
    caseSensitive: false

  - pattern: "DELETE\\s+FROM.*WHERE"
    description: "DELETE with WHERE clause"
    action: ask
    caseSensitive: false

  # --- REDIS ---
  - pattern: "redis-cli.*FLUSHALL"
    description: "Redis FLUSHALL"
    action: block

  - pattern: "redis-cli.*FLUSHDB"
    description: "Redis FLUSHDB"
    action: ask

  # --- PACKAGE MANAGERS ---
  - pattern: "npm\\s+unpublish"
    description: "npm unpublish"
    action: block

  - pattern: "cargo\\s+yank"
    description: "cargo yank"
    action: ask

# =============================================================================
# ZERO ACCESS PATHS - Block ALL operations (read/write/edit/delete)
# These contain secrets/credentials
# =============================================================================
zeroAccessPaths:
  # Environment files
  - ".env"
  - ".env.*"
  - "*.env"

  # SSH keys
  - "~/.ssh/"
  - ".ssh/"
  - "*.pem"
  - "*.key"
  - "id_rsa*"
  - "id_ed25519*"

  # GPG
  - "~/.gnupg/"
  - ".gnupg/"

  # Cloud credentials
  - "~/.aws/"
  - ".aws/"
  - "~/.config/gcloud/"
  - "~/.azure/"
  - "~/.kube/config"

  # Terraform state (contains secrets)
  - "*.tfstate"
  - "*.tfstate.*"

  # Platform tokens
  - ".npmrc"
  - ".pypirc"
  - ".docker/config.json"
  - ".netrc"

  # Certificates
  - "*.p12"
  - "*.pfx"
  - "*.cer"
  - "*secret*.json"
  - "*credential*.json"
  - "*token*.json"

# =============================================================================
# READ-ONLY PATHS - Allow read, block modifications
# System and configuration files
# =============================================================================
readOnlyPaths:
  # System directories
  - "/etc/"
  - "/usr/"
  - "/System/"

  # Shell config (read for reference, don't modify)
  - "~/.bash_history"
  - "~/.zsh_history"

  # Lock files
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "Cargo.lock"
  - "poetry.lock"
  - "Gemfile.lock"

  # Build artifacts
  - "node_modules/"
  - "target/"
  - "dist/"
  - ".next/"
  - "__pycache__/"

# =============================================================================
# NO-DELETE PATHS - Allow read/write/edit, block deletion
# Critical project files
# =============================================================================
noDeletePaths:
  # Documentation
  - "README.md"
  - "LICENSE"
  - "CHANGELOG.md"

  # Git
  - ".git/"
  - ".gitignore"
  - ".gitattributes"

  # Configuration
  - "Dockerfile"
  - "docker-compose.yml"
  - "Makefile"
  - "Cargo.toml"
  - "package.json"
  - "tsconfig.json"

  # Claude Code
  - ".claude/"
  - "CLAUDE.md"

# =============================================================================
# SECRET DETECTION - Block when live secrets appear in Write/Edit content
# Applied to tool_input content during PreToolUse (Write|Edit).
#
# SINGLE SOURCE OF TRUTH (1.33.0, gap B1): the write-time content scan is NOT
# driven by an inline regex list here — it is enforced by `check_secret_content`
# in `damage-control.sh`, which delegates to `.claude/scripts/secret-scan.sh`
# (the same scanner pre-commit, the ship-gate, and sync use). That scanner owns
# the authoritative pattern catalog, placeholder suppression (token-adjacency,
# gap B3), the auto-generated-catalog skip, per-feature allow-files, and token
# redaction. Keeping a second regex list here was DEAD CONFIG that drifted from
# the scanner (e.g. an OpenAI `sk-[a-zA-Z0-9]{20,}` here vs `sk-[A-Za-z0-9]{48,}`
# in the scanner; missing Paddle/Resend/SMTP2Go/Cloudflare). It was removed so the
# advertised posture matches the real, enforced behavior.
#
# To change which patterns block at write-time, edit the PATTERNS catalog in
# `.claude/scripts/secret-scan.sh` (and keep `shared/secret-safety.md` in sync
# via `make secret-doc-sync`). Do NOT re-add a parallel list here.
#
# Kill switch: DAMAGE_CONTROL_DISABLE_SECRET_CONTENT=1 (plus the harness-level
# CLAUDE_DISABLED_HOOKS / CLAUDE_HOOK_PROFILE).
secretDetection:
  enforced_by: ".claude/hooks/damage-control/damage-control.sh::check_secret_content"
  pattern_source: ".claude/scripts/secret-scan.sh"  # authoritative catalog

# =============================================================================
# SENSITIVE PATHS - Additional path-based restrictions
# Complements zeroAccessPaths with content-aware warnings
# =============================================================================
sensitivePaths:
  - pattern: "\\.env($|\\.)"
    action: block
    message: "Modifying .env files is restricted"

  - pattern: "credentials"
    action: warn
    message: "Modifying credential files requires caution"

  - pattern: "\\.pem$"
    action: block
    message: "Modifying PEM certificate files is restricted"

  - pattern: "\\.key$"
    action: block
    message: "Modifying key files is restricted"

  - pattern: "id_rsa"
    action: block
    message: "Modifying SSH key files is restricted"
